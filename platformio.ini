; PlatformIO Project Configuration File
; ESP32-C3 + ESP32-S3 Bridge System
;
; This project contains firmware targets:
;   1. c3-sensor      — ESP32-C3 sensor hub (ultrasonic, DHT, OLED, WS2812 front/rear, ESP-NOW TX)
;   2. s3-dashboard   — ESP32-S3 display bridge (ESP-NOW RX, SPIFFS React UI, SSE; forwards light cmds to C3)
;   3. s3-lvgl-studio — ESP32-S3 native LVGL from lvgl-studio/runtime (particle tunnel + Studio UI + ESP-NOW overlay)
;
; Flash commands:
;   pio run -e c3-sensor -t upload          # Flash C3 sensor hub
;   pio run -e s3-dashboard -t upload       # Flash S3 dashboard
;   pio run -e s3-dashboard -t uploadfs     # Upload React dashboard to S3 SPIFFS
;   pio run -e s3-lvgl-studio -t upload     # Flash S3 native LVGL dashboard (Waveshare 7B)

[platformio]
src_dir = firmware
boards_dir = 15_LVGL_SLIDER/boards

; ============================================================
; ESP32-C3 Sensor Hub
; ============================================================
; Board specs:
;   - ESP32-C3 with 4MB Flash
;   - 0.42" OLED (72x40, SSD1306) on I2C: SDA=GPIO5, SCL=GPIO6, addr 0x3C
;   - Built-in LED on GPIO8 (active LOW)
;   - BOOT button on GPIO9
;   - UART0: RX=GPIO20, TX=GPIO21
;   - USB CDC on GPIO18/19
;
; First flash: hold BOOT, press+release RESET, then upload.
; Subsequent uploads should auto-reset.

[env:c3-sensor]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter =
    +<c3-sensor/>
    -<s3-dashboard/>
lib_deps =
    olikraus/U8g2@^2.35.19
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit NeoPixel@^1.12.3

; Enable USB CDC so Serial prints go to USB serial monitor
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101

; ============================================================
; ESP32-S3 Dashboard Receiver + Display Server
; ============================================================
; Board specs:
;   - Waveshare ESP32-S3-Touch-LCD-7B (1024x600 IPS)
;   - Uses local esp32-XIP-3.1.1 Arduino core (required for this board)
;   - 16MB flash with 8MB octal PSRAM
;   - Receives ESP-NOW from C3 on channel 1 (vehicle LEDs are on the C3, not here)
;   - Hosts AP "ESP32S3-Dashboard" and serves React app from SPIFFS

[env:s3-dashboard]
platform = espressif32
framework = arduino

; Use the Waveshare XIP board definition from the local Arduino core
board = esp32-s3-devkitc1-n16r8
platform_packages =
    framework-arduinoespressif32 @ symlink:///Users/sean/Library/Arduino15/packages/esp32-XIP-3.1.1/hardware/esp32/3.1.1
    framework-arduinoespressif32-libs @ symlink:///Users/sean/Library/Arduino15/packages/esp32-XIP-3.1.1/tools/esp32-arduino-libs/idf-release_v5.3-cfea4f7c-v1

build_src_filter =
    +<s3-dashboard/>
    -<c3-sensor/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; 16MB flash with SPIFFS for serving the React dashboard
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
board_build.psram_type = opi

monitor_speed = 115200

; Uncomment to specify upload port explicitly:
; upload_port = /dev/cu.usbmodem*

; ============================================================
; ESP32-S3 LVGL Studio runtime (Waveshare 7B RGB + lvgl-studio export)
; ============================================================
; CarPlay dashboard UI (LVGL 9) + tuned rgb_lcd_port in lvgl_studio_flash.
; I2C / IO expander from 15_LVGL_SLIDER (Waveshare vendor libs).
; Board: ESP32-S3-Touch-LCD-7B from 15_LVGL_SLIDER/boards.

[env:s3-lvgl-studio]
platform = espressif32
framework = arduino
board = ESP32-S3-Touch-LCD-7B
platform_packages =
    framework-arduinoespressif32 @ symlink:///Users/sean/Library/Arduino15/packages/esp32-XIP-3.1.1/hardware/esp32/3.1.1
    framework-arduinoespressif32-libs @ symlink:///Users/sean/Library/Arduino15/packages/esp32-XIP-3.1.1/tools/esp32-arduino-libs/idf-release_v5.3-cfea4f7c-v1

build_src_filter =
    +<lvgl_studio_flash/>
    -<lvgl_studio_flash/ref/*>
    -<lvgl_studio_flash/i2c.cpp>
    -<lvgl_studio_flash/io_extension.cpp>
    +<../15_LVGL_SLIDER/lib/i2c/>
    +<../15_LVGL_SLIDER/lib/io_extension/>
    +<../lvgl_editor/lvgl_editor.c>
    +<../lvgl_editor/lvgl_editor_gen.c>
    +<../lvgl_editor/screens/>
    +<../lvgl_editor/components/>
    +<../lvgl_editor/fonts/>
    +<../inter_32.c>
    +<../inter_96.c>
    -<../lvgl_editor/screens/lvgl_studio_flash_gen 2.c>
    -<../lvgl_editor/screens/lvgl_studio_flash_gen 2.h>
    -<../lvgl_editor/components/freeway_3d_view_gen.c>
    -<../lvgl_editor/components/freeway_3d_view_gen 2.c>
    -<../lvgl_editor/components/freeway_3d_view_gen 2.h>
    -<c3-sensor/>
    -<s3-dashboard/>

lib_extra_dirs =
    ${PROJECT_DIR}/lv_port_pc_vscode
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_USE_SDL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/lv_port_pc_vscode
    -I${PROJECT_DIR}/lvgl-studio/runtime/LVGL_Studio_Flash
    -I${PROJECT_DIR}/lvgl_editor
    -I${PROJECT_DIR}/lvgl_editor/screens
    -I${PROJECT_DIR}/lvgl_editor/components
    -I${PROJECT_DIR}/lvgl_editor/fonts
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/15_LVGL_SLIDER/lib/i2c
    -I${PROJECT_DIR}/15_LVGL_SLIDER/lib/io_extension

board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
board_build.psram_type = opi

monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
upload_speed = 921600
