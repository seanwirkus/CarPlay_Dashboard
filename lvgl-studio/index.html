const LVGL_SYMBOL_CP = Object.fromEntries(LVGL_SYMBOL_LIST.map(([m, , cp]) => [m, cp]));

function expandLvglSymbolsInText(text) {
  const raw = text == null ? "" : String(text);
  return raw.replace(/<<\s*(LV_SYMBOL_[A-Z0-9_]+)\s*>>/g, (_, macro) => {
    const cp = LVGL_SYMBOL_CP[macro];
    return cp !== undefined ? String.fromCodePoint(cp) : _;
  });
}

function textHasLvglSymbolToken(text) {
  return /<<\s*LV_SYMBOL_[A-Z0-9_]+\s*>>/.test(text == null ? "" : String(text));
}

/** C expression for lv_label_set_text: string literals + LV_SYMBOL_* macros */
function cLabelTextExpr(text) {
  const raw = text == null ? "" : String(text);
  if (!raw.includes("<<")) return JSON.stringify(raw);
  const re = /<<\s*(LV_SYMBOL_[A-Z0-9_]+)\s*>>/g;
  const parts = [];
  let last = 0;
  let m;
  while ((m = re.exec(raw)) !== null) {
    if (m.index > last) parts.push(JSON.stringify(raw.slice(last, m.index)));
    if (LVGL_SYMBOL_CP[m[1]] === undefined) parts.push(JSON.stringify(m[0]));
    else parts.push(m[1]);
    last = m.index + m[0].length;
  }
  if (last < raw.length) parts.push(JSON.stringify(raw.slice(last)));
  if (parts.length === 0) return JSON.stringify(raw);
  return parts.join(" ");
}

// ---------- Utility ----------
const hexToLvgl = (hex) => {
  if (!hex) return "0x000000";
  return "0x" + hex.replace("#", "").toUpperCase().padStart(6, "0");
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const opaToLvgl = (opacityPct) => clamp(Math.round((opacityPct ?? 100) * 2.55), 0, 255);

function bindHash(bind) {
  let h = 0;
  for (let i = 0; i < bind.length; i++) h = (h * 31 + bind.charCodeAt(i)) | 0;
  return Math.abs(h);
}

/** Live-preview text for any bind name not listed in simValues */
function dynamicSimLabel(bind, tick) {
  if (!bind) return "—";
  const t = tick * 0.12;
  const u = bind.toLowerCase();
  const H = bindHash(bind) % 997;
  const w = (x) => Math.round(x);
  const gi = Math.floor(tick / 20) % 4;

  if (u.includes("time") || u.includes("clock")) {
    const sec = (Math.floor(tick * 0.12) + H) % 86400;
    const hh = Math.floor(sec / 3600) % 24;
    const mm = Math.floor((sec % 3600) / 60);
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  }
  if (u === "gearp") return gi === 0 ? "P" : " ";
  if (u === "gearr") return gi === 1 ? "R" : " ";
  if (u === "gearn") return gi === 2 ? "N" : " ";
  if (u === "geard") return gi === 3 ? "D" : " ";
  if (u.startsWith("gear") && u.length <= 6) return ["P", "R", "N", "D"][Math.floor(tick / 18 + H * 0.01) % 4];
  if (u.includes("volt")) return (11.8 + 1.4 * (0.5 + 0.5 * Math.sin(t * 0.9 + H * 0.01))).toFixed(1) + " V";
  if (u.includes("oil") && u.includes("pres")) return w(32 + 28 * (0.5 + 0.5 * Math.sin(t * 0.35 + H * 0.02))) + " PSI";
  if (u.includes("oil")) return w(210 + 20 * (0.5 + 0.5 * Math.sin(t * 0.2))) + " °F";
  if (u.includes("odometer") || u === "odo") return w(48293 + tick % 400).toLocaleString() + " mi";
  if (u.includes("trip")) return (124.7 + 0.35 * Math.sin(t * 0.4)).toFixed(1) + " mi";
  if (u.includes("coolant") || u.includes("clnt")) return w(188 + 12 * (0.5 + 0.5 * Math.sin(t * 0.07))) + " °F";
  if (u === "enginetemp" || (u.includes("engine") && u.includes("temp"))) return String(w(185 + 18 * (0.5 + 0.5 * Math.sin(t * 0.065))));
  if (u === "fuel" || (u.includes("fuel") && !u.includes("avg"))) return String(w(58 + 32 * (0.5 + 0.5 * Math.sin(t * 0.085))));
  if (u.includes("intake") || u.includes("iat")) return w(42 + 35 * (0.5 + 0.5 * Math.sin(t * 0.11 + 0.2))) + " °F";
  if (u.includes("lat")) return (37.323 + 0.008 * Math.sin(t * 0.05)).toFixed(4) + "°";
  if (u.includes("lon") || u.includes("lng")) return (-122.052 + 0.008 * Math.cos(t * 0.05)).toFixed(4) + "°";
  if (u.includes("heading") || u.includes("bearing")) return w((360 + tick * 2) % 360) + "°";
  if (u.includes("sat") || u.includes("gpsfix")) return String(6 + (tick % 6));
  if (u.includes("eta") || u.includes("arrival")) {
    const m = 12 + (tick % 45);
    return m + " min";
  }
  if (u.includes("song") || u.includes("track") || u.includes("title"))
    return ["Midnight City", "Blinding Lights", "Satellite", "Nightcall"][tick % 4];
  if (u.includes("artist")) return ["M83", "The Weeknd", "Harry Styles", "Kavinsky"][tick % 4];
  if (u.includes("phone") || u.includes("caller")) return tick % 40 < 3 ? "Incoming…" : "Home";
  if (u.includes("range")) return w(195 + 45 * (0.5 + 0.5 * Math.sin(t * 0.09))) + " mi";
  if (u.includes("soc") || (u.includes("charge") && !u.includes("proximity"))) return w(58 + 35 * (0.5 + 0.5 * Math.sin(t * 0.045))) + "%";
  if (u.includes("power") && u.includes("kw")) return (45 + 12 * Math.sin(t * 0.3)).toFixed(1) + " kW";
  if (u.includes("torque")) return w(180 + 120 * (0.5 + 0.5 * Math.sin(t * 0.25))) + " Nm";
  if (u.includes("throttle") || u.includes("pedal")) return w(100 * (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(t * 0.6)))) + "%";
  if (u.includes("brake")) return w(100 * (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(t * 0.5 + 1)))) + "%";
  if (u.includes("steer") || u.includes("wheel")) return (tick % 2 === 0 ? "" : "-") + w(15 * Math.sin(t * 0.8)) + "°";
  if (u.includes("lap")) return "1:" + String(22 + (tick % 20)).padStart(2, "0") + "." + String(tick % 100).padStart(2, "0");
  if (u.includes("tire") && u.includes("psi")) return w(32 + (tick % 5)) + " PSI";
  if (u.includes("humid")) return w(40 + 35 * (0.5 + 0.5 * Math.sin(t * 0.06))) + "%";
  if (u.includes("outside") || u.includes("exttemp")) return w(55 + 25 * (0.5 + 0.5 * Math.sin(t * 0.04 + H * 0.001))) + " °F";

  const n = w(100 + 85 * (0.5 + 0.5 * Math.sin(t * 0.5 + H * 0.001)));
  return String(n);
}

// ---------- LVGL C Code Export ----------
function exportLvglCode(bg, widgets) {
  const lines = [];
  lines.push("// ============================================================");
  lines.push("// Generated by LVGL Studio — drop into your Arduino / ESP-IDF");
  lines.push("// project. Call build_dashboard(lv_scr_act()) after lv_init().");
  lines.push("// ============================================================");
  lines.push("");
  lines.push("#include \"lvgl.h\"");
  lines.push("#include <stdio.h>");
  lines.push("#include <math.h>");
  lines.push("#include \"esp_timer.h\"");
  lines.push("");

  // Pointer declarations for data-bound widgets.
  // Supports duplicate binds (e.g. two labels both bound to "speed")
  // by creating unique pointer symbols and grouped setter functions.
  const bindCounts = new Map();
  const bindGroups = new Map();
  const widgetVarName = [];
  widgets.forEach((w, idx) => {
    if (!w.bind) {
      widgetVarName[idx] = `w${idx}`;
      return;
    }
    const c = bindCounts.get(w.bind) || 0;
    const next = c + 1;
    bindCounts.set(w.bind, next);
    const vn = next === 1 ? `ui_${w.bind}` : `ui_${w.bind}_${next}`;
    widgetVarName[idx] = vn;
    if (!bindGroups.has(w.bind)) bindGroups.set(w.bind, []);
    bindGroups.get(w.bind).push({ ...w, _vn: vn });
  });
  const bound = widgets.filter(w => w.bind);
  lines.push("// Data-bound widgets (set these via update_dashboard())");
  widgets.forEach((w, idx) => {
    if (!w.bind) return;
    lines.push(`static lv_obj_t *${widgetVarName[idx]} = NULL;`);
  });
  if (bound.length === 0) lines.push("// (none — add a Bind name on any widget to expose it)");
  lines.push("");

  lines.push("void build_dashboard(lv_obj_t *scr) {");
  lines.push(`  lv_obj_set_style_bg_color(scr, lv_color_hex(${hexToLvgl(bg)}), LV_PART_MAIN);`);
  lines.push("  lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, LV_PART_MAIN);");
  lines.push("  lv_obj_set_style_pad_all(scr, 0, LV_PART_MAIN);");
  lines.push("  lv_obj_clear_flag(scr, LV_OBJ_FLAG_SCROLLABLE);");
  lines.push("");

  widgets.forEach((w, idx) => {
    const vn = widgetVarName[idx];
    const decl = w.bind ? vn : `lv_obj_t *${vn}`;
    lines.push(`  // ---- ${w.type} ${w.bind ? "[" + w.bind + "]" : ""} ----`);

    if (w.type === "label") {
      lines.push(`  ${decl} = lv_label_create(scr);`);
      lines.push(`  lv_label_set_text(${vn}, ${cLabelTextExpr(w.text)});`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_style_text_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_text_font(${vn}, &${LVGL_FONT_FOR_SIZE(w.fontSize || 22)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_text_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_text_letter_space(${vn}, ${w.letterSpacing || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_text_align(${vn}, ${LVGL_TEXT_ALIGN(w.textAlign)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
    } else if (w.type === "rect") {
      lines.push(`  ${decl} = lv_obj_create(scr);`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
      lines.push(`  lv_obj_set_style_radius(${vn}, ${w.radius || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_border_width(${vn}, ${w.borderW || 0}, LV_PART_MAIN);`);
      if (w.borderW > 0) {
        lines.push(`  lv_obj_set_style_border_color(${vn}, lv_color_hex(${hexToLvgl(w.border)}), LV_PART_MAIN);`);
      }
      lines.push(`  lv_obj_set_style_shadow_color(${vn}, lv_color_hex(${hexToLvgl(w.shadowColor || "#000000")}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_width(${vn}, ${w.shadowBlur || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_x(${vn}, ${w.shadowX || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_y(${vn}, ${w.shadowY || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_opa(${vn}, ${(w.shadowBlur || 0) > 0 ? 180 : 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_pad_all(${vn}, 0, LV_PART_MAIN);`);
      lines.push(`  lv_obj_clear_flag(${vn}, LV_OBJ_FLAG_SCROLLABLE);`);
    } else if (w.type === "circle") {
      const r = Math.floor(Math.min(w.w, w.h) / 2);
      lines.push(`  ${decl} = lv_obj_create(scr);`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
      lines.push(`  lv_obj_set_style_radius(${vn}, ${r}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_border_color(${vn}, lv_color_hex(${hexToLvgl(w.border)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_border_width(${vn}, ${w.borderW || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_color(${vn}, lv_color_hex(${hexToLvgl(w.shadowColor || "#000000")}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_width(${vn}, ${w.shadowBlur || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_x(${vn}, ${w.shadowX || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_y(${vn}, ${w.shadowY || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_opa(${vn}, ${(w.shadowBlur || 0) > 0 ? 180 : 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_pad_all(${vn}, 0, LV_PART_MAIN);`);
      lines.push(`  lv_obj_clear_flag(${vn}, LV_OBJ_FLAG_SCROLLABLE);`);
    } else if (w.type === "bar") {
      lines.push(`  ${decl} = lv_bar_create(scr);`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
      lines.push(`  lv_bar_set_range(${vn}, 0, 100);`);
      lines.push(`  lv_bar_set_value(${vn}, ${w.value || 0}, LV_ANIM_OFF);`);
      lines.push(`  lv_obj_set_style_bg_color(${vn}, lv_color_hex(${hexToLvgl(w.bgColor)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_radius(${vn}, ${w.radius || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_radius(${vn}, ${w.radius || 0}, LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_border_width(${vn}, 0, LV_PART_MAIN);`);
    } else if (w.type === "arc") {
      lines.push(`  ${decl} = lv_arc_create(scr);`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
      lines.push(`  lv_arc_set_rotation(${vn}, ${w.start || 135});`);
      lines.push(`  lv_arc_set_bg_angles(${vn}, 0, ${w.sweep || 270});`);
      lines.push(`  lv_arc_set_range(${vn}, 0, 100);`);
      lines.push(`  lv_arc_set_value(${vn}, ${w.value || 0});`);
      lines.push(`  lv_obj_remove_style(${vn}, NULL, LV_PART_KNOB);`);
      lines.push(`  lv_obj_set_style_arc_width(${vn}, ${w.width || 12}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_arc_width(${vn}, ${w.width || 12}, LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_arc_color(${vn}, lv_color_hex(${hexToLvgl(w.bgColor)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_arc_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_arc_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_arc_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_INDICATOR);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, LV_OPA_TRANSP, LV_PART_MAIN);`);
      lines.push(`  lv_obj_clear_flag(${vn}, LV_OBJ_FLAG_CLICKABLE);`);
    } else if (w.type === "button") {
      lines.push(`  ${decl} = lv_btn_create(scr);`);
      lines.push(`  lv_obj_set_size(${vn}, ${w.w}, ${w.h});`);
      lines.push(`  lv_obj_set_pos(${vn}, ${w.x}, ${w.y});`);
      lines.push(`  lv_obj_set_style_radius(${vn}, ${w.radius || 8}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_color(${vn}, lv_color_hex(${hexToLvgl(w.color)}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_bg_opa(${vn}, ${opaToLvgl(w.opacity)}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_color(${vn}, lv_color_hex(${hexToLvgl(w.shadowColor || "#000000")}), LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_width(${vn}, ${w.shadowBlur || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_x(${vn}, ${w.shadowX || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_ofs_y(${vn}, ${w.shadowY || 0}, LV_PART_MAIN);`);
      lines.push(`  lv_obj_set_style_shadow_opa(${vn}, ${(w.shadowBlur || 0) > 0 ? 180 : 0}, LV_PART_MAIN);`);
      lines.push(`  { lv_obj_t *lbl = lv_label_create(${vn});`);
      lines.push(`    lv_label_set_text(lbl, ${cLabelTextExpr(w.text)});`);
      lines.push(`    lv_obj_set_width(lbl, lv_pct(100));`);
      lines.push(`    lv_obj_set_style_text_color(lbl, lv_color_hex(${hexToLvgl(w.textColor || "#FFFFFF")}), LV_PART_MAIN);`);
      lines.push(`    lv_obj_set_style_text_font(lbl, &${LVGL_FONT_FOR_SIZE(w.fontSize || 22)}, LV_PART_MAIN);`);
      lines.push(`    lv_obj_set_style_text_align(lbl, ${LVGL_TEXT_ALIGN(w.textAlign)}, LV_PART_MAIN);`);
      lines.push(`    lv_obj_align(lbl, LV_ALIGN_CENTER, 0, 0); }`);
    }
    lines.push("");
  });
  lines.push("}");
  lines.push("");

  // Update function stubs
  if (bound.length > 0) {
    lines.push("// ------------------------------------------------------------");
    lines.push("// Example: call from your data pipeline to update live values.");
    lines.push("// ------------------------------------------------------------");
    bindGroups.forEach((items, bindName) => {
      const labels = items.filter(i => i.type === "label");
      const bars = items.filter(i => i.type === "bar");
      const arcs = items.filter(i => i.type === "arc");
      if (labels.length > 0) {
        const body = labels.map(i => `if (${i._vn}) lv_label_set_text(${i._vn}, s);`).join(" ");
        lines.push(`void set_${bindName}_text(const char *s) { ${body} }`);
      }
      if (bars.length > 0) {
        const body = bars.map(i => `if (${i._vn}) lv_bar_set_value(${i._vn}, v, LV_ANIM_OFF);`).join(" ");
        lines.push(`void set_${bindName}_value(int v) { ${body} }`);
      }
      if (arcs.length > 0) {
        const body = arcs.map(i => `if (${i._vn}) lv_arc_set_value(${i._vn}, v);`).join(" ");
        lines.push(`void set_${bindName}_arc(int v) { ${body} }`);
      }
    });

    lines.push("");
    lines.push("// ------------------------------------------------------------");
    lines.push("// Live demo: updates every bound widget so the board shows motion after flash.");
    lines.push("// Call from loop() ~20 Hz inside lvgl_port_lock() until your real data feeds these setters.");
    lines.push("// ------------------------------------------------------------");
    lines.push("void studio_demo_tick(void) {");
    lines.push("  char buf[48];");
    lines.push("  uint32_t ms = (uint32_t)(esp_timer_get_time() / 1000ULL);");
    lines.push("  static uint32_t t0 = 0;");
    lines.push("  if (t0 == 0) t0 = ms;");
    lines.push("  uint32_t t = ms - t0;");
    lines.push("  (void)buf;");
    lines.push("");
    bindGroups.forEach((items, bindName) => {
      const labels = items.filter(i => i.type === "label");
      const bars = items.filter(i => i.type === "bar");
      const arcs = items.filter(i => i.type === "arc");
      const L = bindName.toLowerCase();
      if (labels.length > 0) {
        let line = "";
        if (L.includes("battery")) {
          line = `  snprintf(buf, sizeof(buf), "%d", (int)(12 + (t / 200) % 88)); set_${bindName}_text(buf);`;
        } else if (L === "fuel" || (L.includes("fuel") && !L.includes("avg"))) {
          line = `  snprintf(buf, sizeof(buf), "%d", (int)(18 + (t / 160) % 82)); set_${bindName}_text(buf);`;
        } else if (L.includes("cabintemp") || L === "cabintempf" || (L.includes("temp") && L.includes("cabin"))) {
          line = `  snprintf(buf, sizeof(buf), "%.1f", 88.0f + (float)(t % 5000) / 250.0f); set_${bindName}_text(buf);`;
        } else if (L.includes("speedlimit")) {
          line = `  snprintf(buf, sizeof(buf), "%d", (int)(50 + (t / 260) % 35)); set_${bindName}_text(buf);`;
        } else if (L.includes("speed") && !L.includes("limit") && !L.includes("avg")) {
          line = `  snprintf(buf, sizeof(buf), "%d", (int)(25 + (t / 100) % 75)); set_${bindName}_text(buf);`;
        } else if (L.includes("proximityin") || (L.includes("proximity") && L.includes("in"))) {
          line = `  snprintf(buf, sizeof(buf), "%d in", (int)(8 + (t / 150) % 92)); set_${bindName}_text(buf);`;
        } else if (L.includes("distance")) {
          line = `  snprintf(buf, sizeof(buf), "%d mi", (int)(40 + (t / 70) % 420)); set_${bindName}_text(buf);`;
        } else if (L.includes("avgspeed")) {
          line = `  snprintf(buf, sizeof(buf), "%d mph", (int)(35 + (t / 90) % 55)); set_${bindName}_text(buf);`;
        } else if (L.includes("avgfuel") || (L.includes("fuel") && L.includes("avg"))) {
          line = `  snprintf(buf, sizeof(buf), "%d mpg", (int)(18 + (t / 100) % 35)); set_${bindName}_text(buf);`;
        } else if (L.includes("rpm")) {
          line = `  snprintf(buf, sizeof(buf), "%.1f", 0.8f + (float)(t % 4000) / 2000.0f); set_${bindName}_text(buf);`;
        } else if (L.includes("boost")) {
          line = `  snprintf(buf, sizeof(buf), "%d", (int)(4 + (t / 120) % 22)); set_${bindName}_text(buf);`;
        } else if (L === "gearp") {
          line = `  set_${bindName}_text(((t / 700) % 4) == 0 ? "P" : " ");`;
        } else if (L === "gearr") {
          line = `  set_${bindName}_text(((t / 700) % 4) == 1 ? "R" : " ");`;
        } else if (L === "gearn") {
          line = `  set_${bindName}_text(((t / 700) % 4) == 2 ? "N" : " ");`;
        } else if (L === "geard") {
          line = `  set_${bindName}_text(((t / 700) % 4) == 3 ? "D" : " ");`;
        } else if (L.includes("time") || L.includes("clock")) {
          line = `  { uint32_t s = (t / 250) % 86400u; int hh = (int)(s / 3600) % 24; int mm = (int)((s % 3600) / 60); snprintf(buf, sizeof(buf), "%02d:%02d", hh, mm); set_${bindName}_text(buf); }`;
        } else if (L.includes("volt")) {
          line = `  snprintf(buf, sizeof(buf), "%.1f V", 11.8 + 1.4 * sin((double)t * 0.002)); set_${bindName}_text(buf);`;
        } else if (L.includes("odometer") || L === "odo") {
          line = `  snprintf(buf, sizeof(buf), "%lu mi", (unsigned long)(48210u + (t % 500))); set_${bindName}_text(buf);`;
        } else if (L.includes("trip")) {
          line = `  snprintf(buf, sizeof(buf), "%.1f mi", 124.7 + 0.35 * sin((double)t * 0.0004)); set_${bindName}_text(buf);`;
        } else if (L.includes("oil") && L.includes("pres")) {
          line = `  snprintf(buf, sizeof(buf), "%d PSI", (int)(32 + (t / 90) % 28)); set_${bindName}_text(buf);`;
        } else if (L.includes("coolant") || L.includes("clnt") || L === "enginetemp") {
          line = `  snprintf(buf, sizeof(buf), "%d °F", (int)(185 + (t / 120) % 20)); set_${bindName}_text(buf);`;
        } else if (L.includes("eta") || L.includes("arrival")) {
          line = `  snprintf(buf, sizeof(buf), "%u min", (unsigned)(8 + (t / 400) % 35)); set_${bindName}_text(buf);`;
        } else if (L.includes("outside") || L.includes("exttemp")) {
          line = `  snprintf(buf, sizeof(buf), "%d °F", (int)(55 + (t / 100) % 35)); set_${bindName}_text(buf);`;
        } else if (L.includes("naveta")) {
          line = `  snprintf(buf, sizeof(buf), "%u min", (unsigned)(8 + (t / 380) % 30)); set_${bindName}_text(buf);`;
        } else {
          line = `  snprintf(buf, sizeof(buf), "%u", (unsigned)(1 + (t / 130) % 999)); set_${bindName}_text(buf);`;
        }
        lines.push(line);
      }
      if (bars.length > 0) {
        lines.push(`  set_${bindName}_value((int)((t / 40) % 101));`);
      }
      if (arcs.length > 0) {
        lines.push(`  set_${bindName}_arc((int)((t / 35) % 101));`);
      }
      lines.push("");
    });
    lines.push("}");
  } else {
    lines.push("");
    lines.push("void studio_demo_tick(void) { /* no bound widgets */ }");
  }
  return lines.join("\n");
}

// ---------- Canvas Widget Renderer ----------
function WidgetView({ w, selected, onMouseDown }) {
  const common = {
    position: "absolute",
    left: w.x,
    top: w.y,
    width: w.w,
    height: w.h,
    opacity: (w.opacity ?? 100) / 100,
    outline: selected ? "2px solid #00E5DD" : "1px dashed transparent",
    outlineOffset: selected ? "1px" : "0",
    filter: (w.shadowBlur || 0) > 0 ? `drop-shadow(${w.shadowX || 0}px ${w.shadowY || 0}px ${w.shadowBlur || 0}px ${w.shadowColor || "#000000"})` : "none",
    cursor: "move",
    userSelect: "none",
  };

  if (w.type === "label") {
    const ta = w.textAlign === "center" ? "center" : w.textAlign === "right" ? "right" : "left";
    const shown = expandLvglSymbolsInText(w.text);
    const sym = textHasLvglSymbolToken(w.text);
    return (
      <div className={sym ? "lvgl-symbol-text" : undefined}
           style={{ ...common, boxSizing: "border-box", color: w.color, fontSize: w.fontSize, fontWeight: w.fontWeight || 500, letterSpacing: `${w.letterSpacing || 0}px`, lineHeight: 1.15, whiteSpace: "pre-wrap", textAlign: ta, fontFamily: sym ? undefined : '"SF Pro Display", "Inter", system-ui, sans-serif' }}
           onMouseDown={onMouseDown}>
        {shown}
      </div>
    );
  }
  if (w.type === "rect") {
    return <div style={{ ...common, background: w.color, borderRadius: w.radius, border: w.borderW ? `${w.borderW}px solid ${w.border}` : "none" }} onMouseDown={onMouseDown} />;
  }
  if (w.type === "circle") {
    return <div style={{ ...common, background: w.color, borderRadius: "9999px", border: w.borderW ? `${w.borderW}px solid ${w.border}` : "none" }} onMouseDown={onMouseDown} />;
  }
  if (w.type === "bar") {
    const pct = clamp(w.value || 0, 0, 100);
    return (
      <div style={{ ...common, background: w.bgColor, borderRadius: w.radius }} onMouseDown={onMouseDown}>
        <div style={{ height: "100%", width: `${pct}%`, background: w.color, borderRadius: w.radius, transition: "width 120ms linear" }} />
      </div>
    );
  }
  if (w.type === "arc") {
    const size = Math.min(w.w, w.h);
    const r = size / 2 - w.width / 2;
    const cx = w.w / 2;
    const cy = w.h / 2;
    const start = w.start;
    const sweepBg = w.sweep;
    const sweepFg = (w.sweep * (w.value || 0)) / 100;
    const toXY = (deg) => [cx + r * Math.cos((deg * Math.PI) / 180), cy + r * Math.sin((deg * Math.PI) / 180)];
    const arcPath = (from, to) => {
      const [x1, y1] = toXY(from);
      const [x2, y2] = toXY(to);
      const large = Math.abs(to - from) > 180 ? 1 : 0;
      return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
    };
    return (
      <div style={common} onMouseDown={onMouseDown}>
        <svg width={w.w} height={w.h} style={{ overflow: "visible" }}>
          <path d={arcPath(start, start + sweepBg)} stroke={w.bgColor} strokeWidth={w.width} fill="none" />
          {sweepFg > 0 && (
            <path d={arcPath(start, start + sweepFg)} stroke={w.color} strokeWidth={w.width} fill="none" strokeLinecap="butt" />
          )}
        </svg>
      </div>
    );
  }
  if (w.type === "button") {
    const ta = w.textAlign === "left" ? "flex-start" : w.textAlign === "right" ? "flex-end" : "center";
    const shown = expandLvglSymbolsInText(w.text);
    const sym = textHasLvglSymbolToken(w.text);
    return (
      <div className={sym ? "lvgl-symbol-text" : undefined}
           style={{ ...common, boxSizing: "border-box", background: w.color, borderRadius: w.radius, display: "flex", alignItems: "center", justifyContent: ta, paddingLeft: 10, paddingRight: 10, color: w.textColor, fontSize: w.fontSize, fontWeight: w.fontWeight || 600, whiteSpace: "pre", fontFamily: sym ? undefined : '"SF Pro Display", "Inter", system-ui, sans-serif' }} onMouseDown={onMouseDown}>
        {shown}
      </div>
    );
  }
  return null;
}

// ---------- Main App ----------
function App() {
  const [project, setProject] = useState(PRESET_WRX_2006);
  const [selectedId, setSelectedId] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [exportText, setExportText] = useState("");
  const [tick, setTick] = useState(0);
  const [animate, setAnimate] = useState(true);
  const [bridgeUrl, setBridgeUrl] = useState("http://127.0.0.1:8765");
  const [bridgeBusy, setBridgeBusy] = useState(false);
  const [bridgeStatus, setBridgeStatus] = useState("Bridge not checked");
  const [bridgePort, setBridgePort] = useState("");
  const [bridgePorts, setBridgePorts] = useState([]);
  const [bridgeLog, setBridgeLog] = useState("");
  const [eraseFlash, setEraseFlash] = useState(false);
  const [hwConfig, setHwConfig] = useState({ tearingMode: 3, bounceLines: 10, pclkMHz: 16, refrPeriod: 8 });
  const [demoMode, setDemoMode] = useState("");
  const [snapGrid, setSnapGrid] = useState(true);
  const [snapSize, setSnapSize] = useState(8);
  const canvasRef = useRef(null);
  const dragState = useRef(null);
  const projectRef = useRef(PRESET_WRX_2006);
  const historyRef = useRef([JSON.stringify(PRESET_WRX_2006)]);
  const historyIndexRef = useRef(0);
  const [historyMeta, setHistoryMeta] = useState({ index: 0, size: 1 });

  useEffect(() => {
    projectRef.current = project;
  }, [project]);

  const syncHistoryMeta = useCallback(() => {
    setHistoryMeta({ index: historyIndexRef.current, size: historyRef.current.length });
  }, []);

  const pushHistorySnapshot = useCallback((nextProject) => {
    const snapshot = JSON.stringify(nextProject);
    const current = historyRef.current[historyIndexRef.current];
    if (snapshot === current) return;
    let nextHistory = historyRef.current.slice(0, historyIndexRef.current + 1);
    nextHistory.push(snapshot);
    if (nextHistory.length > 300) {
      nextHistory = nextHistory.slice(nextHistory.length - 300);
    }
    historyRef.current = nextHistory;
    historyIndexRef.current = nextHistory.length - 1;
    syncHistoryMeta();
  }, [syncHistoryMeta]);

  const applyProject = useCallback((updater, options = { pushHistory: true }) => {
    setProject(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (options.pushHistory !== false) pushHistorySnapshot(next);
      return next;
    });
  }, [pushHistorySnapshot]);

  const snapCoord = useCallback((v) => {
    const x = Math.round(Number(v) || 0);
    if (!snapGrid || snapSize < 2) return x;
    return Math.round(x / snapSize) * snapSize;
  }, [snapGrid, snapSize]);

  const undo = useCallback(() => {
    if (historyIndexRef.current <= 0) return;
    historyIndexRef.current -= 1;
    const snapshot = historyRef.current[historyIndexRef.current];
    setProject(JSON.parse(snapshot));
    syncHistoryMeta();
  }, [syncHistoryMeta]);

  const redo = useCallback(() => {
    if (historyIndexRef.current >= historyRef.current.length - 1) return;
    historyIndexRef.current += 1;
    const snapshot = historyRef.current[historyIndexRef.current];
    setProject(JSON.parse(snapshot));
    syncHistoryMeta();
  }, [syncHistoryMeta]);

  // Animate simulated data (updates any bound widget to show liveness)
  useEffect(() => {
    if (!animate) return;
    const h = setInterval(() => setTick(t => t + 1), 120);
    return () => clearInterval(h);
  }, [animate]);

  const simValues = useMemo(() => {
    const t = tick * 0.12;
    const gi = Math.floor(tick / 20) % 4;
    return {
      speed: Math.round(55 + 25 * Math.sin(t * 0.4) + 15 * Math.sin(t * 0.9)),
      rpm: Math.round(30 + 30 * (0.5 + 0.5 * Math.sin(t * 0.5))),
      rpmK: (2 + 3 * (0.5 + 0.5 * Math.sin(t * 0.5))).toFixed(1),
      boost: Math.round(8 + 6 * Math.sin(t * 0.7)),
      battery: 92 + Math.round(6 * (0.5 + 0.5 * Math.sin(t * 0.05))),
      cabinTempF: (98 + 3 * Math.sin(t * 0.1)).toFixed(1),
      distance: Math.round(180 + 8 * Math.sin(t * 0.1)) + " mi",
      avgSpeed: Math.round(72 + 8 * Math.sin(t * 0.2)) + " mph",
      avgFuel: Math.round(30 + 6 * Math.sin(t * 0.15)) + " mpg",
      proximity: Math.round(50 + 40 * Math.sin(t * 0.6)),
      proximityIn: Math.round(60 + 40 * Math.sin(t * 0.6)) + " in",
      speedLimit: String(45 + Math.round(35 * (0.5 + 0.5 * Math.sin(t * 0.08)))),
      fuel: String(Math.round(62 + 18 * (0.5 + 0.5 * Math.sin(t * 0.09)))),
      gearP: gi === 0 ? "P" : " ",
      gearR: gi === 1 ? "R" : " ",
      gearN: gi === 2 ? "N" : " ",
      gearD: gi === 3 ? "D" : " ",
      engineTemp: String(Math.round(185 + 12 * (0.5 + 0.5 * Math.sin(t * 0.06)))),
      oilPressure: Math.round(38 + 8 * (0.5 + 0.5 * Math.sin(t * 0.4))) + " PSI",
      voltage: (13.9 + 0.35 * Math.sin(t * 0.5)).toFixed(1) + " V",
      odometer: (48210 + (tick % 500)).toLocaleString() + " mi",
      navEta: `${8 + (tick % 22)} min`,
      outsideTemp: Math.round(62 + 18 * (0.5 + 0.5 * Math.sin(t * 0.03))) + " °F",
    };
  }, [tick]);

  // Apply simulated bindings without mutating project
  const renderedWidgets = useMemo(() => {
    return project.widgets.map(w => {
      if (!w.bind || !animate) return w;
      let v = simValues[w.bind];
      if (w.type === "label") {
        if (v === undefined) v = dynamicSimLabel(w.bind, tick);
        return { ...w, text: String(v) };
      }
      if (w.type === "bar" || w.type === "arc") {
        if (v === undefined) {
          const h = bindHash(w.bind);
          return { ...w, value: ((tick * 3 + h) % 101 + 101) % 101 };
        }
        return { ...w, value: typeof v === "number" ? v : parseInt(String(v), 10) || 0 };
      }
      if (v === undefined) return w;
      return w;
    });
  }, [project.widgets, simValues, animate, tick]);

  const selected = project.widgets.find(w => w.id === selectedId) || null;
  const canUndo = historyMeta.index > 0;
  const canRedo = historyMeta.index < historyMeta.size - 1;

  // --- Widget ops ---
  const addWidget = (type) => {
    const d = WIDGET_DEFS[type].defaults;
    const nw = { id: genId(), type, ...d };
    applyProject(p => ({ ...p, widgets: [...p.widgets, nw] }));
    setSelectedId(nw.id);
  };
  const updateSelected = (patch) => {
    applyProject(p => ({ ...p, widgets: p.widgets.map(w => w.id === selectedId ? { ...w, ...patch } : w) }));
  };
  const deleteSelected = () => {
    applyProject(p => ({ ...p, widgets: p.widgets.filter(w => w.id !== selectedId) }));
    setSelectedId(null);
  };
  const duplicateSelected = () => {
    if (!selected) return;
    const copy = { ...selected, id: genId(), x: snapCoord(selected.x + 16), y: snapCoord(selected.y + 16) };
    applyProject(p => ({ ...p, widgets: [...p.widgets, copy] }));
    setSelectedId(copy.id);
  };
  const moveLayer = (dir) => {
    if (!selectedId) return;
    applyProject(p => {
      const i = p.widgets.findIndex(w => w.id === selectedId);
      if (i < 0) return p;
      const arr = [...p.widgets];
      const j = dir === "up" ? Math.min(arr.length - 1, i + 1) : Math.max(0, i - 1);
      if (i === j) return p;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return { ...p, widgets: arr };
    });
  };

  // --- Drag handling ---
  const onWidgetMouseDown = (w, e) => {
    e.stopPropagation();
    setSelectedId(w.id);
    const rect = canvasRef.current.getBoundingClientRect();
    const scale = rect.width / 1024;
    dragState.current = {
      id: w.id,
      startX: e.clientX,
      startY: e.clientY,
      origX: w.x,
      origY: w.y,
      scale,
    };
    window.addEventListener("mousemove", onDragMove);
    window.addEventListener("mouseup", onDragEnd);
  };
  const onDragMove = (e) => {
    const d = dragState.current;
    if (!d) return;
    const dx = (e.clientX - d.startX) / d.scale;
    const dy = (e.clientY - d.startY) / d.scale;
    setProject(p => ({
      ...p,
      widgets: p.widgets.map(w => w.id === d.id ? { ...w, x: snapCoord(d.origX + dx), y: snapCoord(d.origY + dy) } : w)
    }));
  };
  const onDragEnd = () => {
    pushHistorySnapshot(projectRef.current);
    dragState.current = null;
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragEnd);
  };

  // Keyboard shortcuts
  useEffect(() => {
    const h = (e) => {
      const inField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
      const cmd = e.metaKey || e.ctrlKey;

      if (cmd && e.key.toLowerCase() === "z") {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
        return;
      }
      if (cmd && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
      if (cmd && e.key.toLowerCase() === "s") { e.preventDefault(); doSaveJson(); return; }
      if (cmd && e.key.toLowerCase() === "e") { e.preventDefault(); doExport(); return; }
      if (inField) return;
      if (!selectedId) return;

      if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); deleteSelected(); return; }
      const nudge = e.shiftKey ? (snapGrid ? snapSize * 4 : 10) : (snapGrid ? snapSize : 1);
      if (e.key === "ArrowUp") { e.preventDefault(); updateSelected({ y: snapCoord(selected.y - nudge) }); }
      if (e.key === "ArrowDown") { e.preventDefault(); updateSelected({ y: snapCoord(selected.y + nudge) }); }
      if (e.key === "ArrowLeft") { e.preventDefault(); updateSelected({ x: snapCoord(selected.x - nudge) }); }
      if (e.key === "ArrowRight") { e.preventDefault(); updateSelected({ x: snapCoord(selected.x + nudge) }); }
      if (cmd && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSelected(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [selectedId, selected, undo, redo, snapGrid, snapSize, snapCoord]);

  // Export / Import
  const doExport = () => {
    setExportText(exportLvglCode(project.bg, project.widgets));
    setShowExport(true);
  };
  const doSaveJson = () => {
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "lvgl-project.json"; a.click();
    URL.revokeObjectURL(url);
  };
  const doLoadJson = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = ".json,application/json";
    inp.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const text = await f.text();
      try {
        const obj = JSON.parse(text);
        if (obj && Array.isArray(obj.widgets)) {
          applyProject(obj);
          setSelectedId(null);
        }
      } catch (err) { alert("Invalid JSON"); }
    };
    inp.click();
  };

  // Build/flash bridge (local Python server)
  const callBridge = async (path, method = "GET", body = null) => {
    const url = `${bridgeUrl.replace(/\/$/, "")}${path}`;
    const res = await fetch(url, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok || json.ok === false) {
      const err = new Error(json.error || `Bridge request failed (${res.status})`);
      err.bridge = json;
      throw err;
    }
    return json;
  };

  const refreshBridgeStatus = async () => {
    setBridgeBusy(true);
    try {
      const data = await callBridge("/api/status");
      setBridgeStatus(`Connected (${data.arduino_cli || "arduino-cli unknown"})`);
      setBridgePorts(data.ports || []);
      const ports = data.ports || [];
      if (ports.length === 1) setBridgePort((cur) => cur || ports[0]);
      setBridgeLog(JSON.stringify(data, null, 2));
    } catch (err) {
      setBridgeStatus(`Bridge error: ${err.message}`);
    } finally {
      setBridgeBusy(false);
    }
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setBridgeBusy(true);
      try {
        const url = `${bridgeUrl.replace(/\/$/, "")}/api/status`;
        const res = await fetch(url);
        const json = await res.json().catch(() => ({}));
        if (cancelled) return;
        if (res.ok && json.ok !== false) {
          setBridgeStatus(`Connected (${json.arduino_cli || "arduino-cli"})`);
          setBridgePorts(json.ports || []);
          const ports = json.ports || [];
          if (ports.length === 1) setBridgePort((p) => p || ports[0]);
        } else {
          setBridgeStatus(`Bridge: start or run ./restart_bridge.sh in lvgl-studio`);
        }
      } catch {
        if (!cancelled) setBridgeStatus(`Bridge: start or run ./restart_bridge.sh in lvgl-studio`);
      } finally {
        if (!cancelled) setBridgeBusy(false);
      }
    })();
    return () => { cancelled = true; };
  }, [bridgeUrl]);

  const copyRestartBridgeCmd = () => {
    const cmd = "cd lvgl-studio && chmod +x restart_bridge.sh && ./restart_bridge.sh";
    navigator.clipboard.writeText(cmd);
    setBridgeStatus("Copied restart command to clipboard (run from ProjectsPage repo root)");
  };

  const pushAndRun = async (mode) => {
    setBridgeBusy(true);
    try {
      let code = "";
      if (demoMode) {
        code = [
          "#include \"lvgl.h\"",
          "#include \"demos/lv_demos.h\"",
          "void build_dashboard(lv_obj_t *scr) {",
          "  lv_obj_clean(scr);",
          `  lv_demo_${demoMode}();`,
          "}"
        ].join("\n");
      } else {
        code = exportLvglCode(project.bg, project.widgets);
      }
      await callBridge("/api/push-code", "POST", { code, hwConfig });
      const flashBody = { port: bridgePort, eraseFlash: mode === "flash" ? eraseFlash : false };
      const data = await callBridge(mode === "flash" ? "/api/build-flash" : "/api/build", "POST", flashBody);
      setBridgeLog((data.output || "").slice(-12000));
      setBridgeStatus(mode === "flash" ? "Flash complete" : "Build complete");
      if (data.ports) setBridgePorts(data.ports);
    } catch (err) {
      setBridgeStatus(`Build/flash failed: ${err.message}`);
      const b = err.bridge;
      if (b?.output) setBridgeLog((b.output || "").slice(-12000));
      if (b?.ports) setBridgePorts(b.ports);
    } finally {
      setBridgeBusy(false);
    }
  };

  // ---------- Render ----------
  return (
    <div className="h-screen w-screen flex flex-col bg-[#0B0C10] text-gray-200">
      {typeof window !== "undefined" && window.location.protocol === "file:" && (
        <div className="shrink-0 px-4 py-2.5 bg-amber-950/80 border-b border-amber-700/60 text-amber-100 text-sm leading-snug">
          <span className="font-medium">Opened as a local file.</span>{" "}
          Flash and some browser features break under <code className="mono text-amber-200/90">file://</code>.{" "}
          Start <code className="mono text-amber-200/90">bridge_server.py</code> and open{" "}
          <a className="underline text-[#7FFFD4] hover:text-[#9FFFE4]" href={bridgeUrl + "/"}>{bridgeUrl}/</a>{" "}
          instead.
        </div>
      )}
      {/* Top bar */}
      <div className="h-14 border-b border-[#1E1F26] flex items-center px-4 gap-3 shrink-0">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-md bg-gradient-to-br from-[#00E5DD] to-[#34D64A] flex items-center justify-center text-black font-bold text-sm">L</div>
          <div className="font-semibold tracking-tight">LVGL Studio</div>
          <div className="text-xs text-gray-500 ml-2">1024 × 600</div>
        </div>
        <div className="flex-1" />
        <select
          className="bg-[#17181C] border border-[#2A2B33] text-sm rounded px-2 py-1 text-gray-300 focus:outline-none"
          onChange={(e) => {
            const v = e.target.value;
            if (v === "tesla") applyProject(JSON.parse(JSON.stringify(PRESET_TESLA)));
            else if (v === "wrx2006") applyProject(JSON.parse(JSON.stringify(PRESET_WRX_2006)));
            else if (v === "gauges") applyProject(JSON.parse(JSON.stringify(PRESET_GAUGE_DEMO)));
            else if (v === "blank") applyProject({ ...PRESET_BLANK });
            setSelectedId(null);
            e.target.value = "preset";
          }}
          defaultValue="preset"
        >
          <option value="preset" disabled>Load preset…</option>
          <option value="tesla">Tesla EV dashboard</option>
          <option value="wrx2006">Subaru WRX 2006</option>
          <option value="gauges">3-gauge cluster</option>
          <option value="blank">Blank</option>
        </select>
        <select
          className="bg-[#17181C] border border-[#2A2B33] text-sm rounded px-2 py-1 text-gray-300 focus:outline-none"
          value={demoMode}
          onChange={(e) => setDemoMode(e.target.value)}
        >
          <option value="">Custom UI</option>
          <option value="widgets">LVGL Widgets Demo</option>
          <option value="benchmark">LVGL Benchmark</option>
          <option value="music">LVGL Music Player</option>
          <option value="stress">LVGL Stress Test</option>
        </select>
        <button onClick={undo} disabled={!canUndo} title="Cmd/Ctrl+Z"
          className={`px-3 py-1.5 rounded text-sm border ${canUndo ? "bg-[#17181C] border-[#2A2B33] hover:bg-[#1E1F26]" : "bg-[#121318] border-[#20212A] text-gray-600 cursor-not-allowed"}`}>
          Undo
        </button>
        <button onClick={redo} disabled={!canRedo} title="Shift+Cmd/Ctrl+Z"
          className={`px-3 py-1.5 rounded text-sm border ${canRedo ? "bg-[#17181C] border-[#2A2B33] hover:bg-[#1E1F26]" : "bg-[#121318] border-[#20212A] text-gray-600 cursor-not-allowed"}`}>
          Redo
        </button>
        <button onClick={() => setAnimate(a => !a)} className={`px-3 py-1.5 rounded text-sm border ${animate ? "bg-[#00E5DD]/10 border-[#00E5DD]/40 text-[#00E5DD]" : "bg-[#17181C] border-[#2A2B33] text-gray-400"}`}>
          {animate ? "● Live preview" : "○ Static"}
        </button>
        <button onClick={doLoadJson} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26]">Import</button>
        <button onClick={doSaveJson} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26]">Save JSON</button>
        <button onClick={doExport} className="px-3 py-1.5 rounded text-sm bg-gradient-to-r from-[#00E5DD] to-[#34D64A] text-black font-semibold hover:opacity-90">Export LVGL C</button>
        <button onClick={refreshBridgeStatus} disabled={bridgeBusy} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] disabled:opacity-50" title="Ping bridge">Bridge</button>
        <button type="button" onClick={copyRestartBridgeCmd} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] text-gray-300" title="Copy shell command to kill port 8765 and start bridge_server.py">
          Restart cmd
        </button>
        <button onClick={() => pushAndRun("build")} disabled={bridgeBusy} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] disabled:opacity-50">Build S3</button>
        <button onClick={() => pushAndRun("flash")} disabled={bridgeBusy} className="px-3 py-1.5 rounded text-sm bg-[#34D64A]/20 border border-[#34D64A]/50 text-[#34D64A] hover:bg-[#34D64A]/30 disabled:opacity-50">Flash S3</button>
      </div>

      {/* Body */}
      <div className="flex-1 flex overflow-hidden">
        {/* Left palette */}
        <div className="w-56 shrink-0 border-r border-[#1E1F26] p-3 overflow-y-auto">
          <div className="text-xs uppercase tracking-wider text-gray-500 mb-2">Add widget</div>
          <div className="grid grid-cols-2 gap-2 mb-4">
            {Object.entries(WIDGET_DEFS).map(([k, d]) => (
              <button key={k} onClick={() => addWidget(k)}
                className="aspect-square flex flex-col items-center justify-center rounded-md bg-[#17181C] border border-[#2A2B33] hover:border-[#00E5DD] hover:bg-[#1E1F26] transition-colors">
                <div className="text-2xl leading-none">{d.icon}</div>
                <div className="text-[10px] mt-1 text-gray-400">{d.label}</div>
              </button>
            ))}
          </div>

          <div className="text-xs uppercase tracking-wider text-gray-500 mb-2 mt-4">Layers</div>
          <div className="space-y-1">
            {project.widgets.slice().reverse().map(w => (
              <div key={w.id}
                onClick={() => setSelectedId(w.id)}
                className={`flex items-center gap-2 px-2 py-1 rounded text-xs cursor-pointer ${w.id === selectedId ? "bg-[#00E5DD]/10 text-[#00E5DD]" : "bg-[#17181C] hover:bg-[#1E1F26] text-gray-300"}`}>
                <span className="w-4 text-center">{WIDGET_DEFS[w.type]?.icon}</span>
                <span className="truncate flex-1">{w.bind || w.text || w.type}</span>
                <span className="text-gray-500 text-[10px]">{w.x},{w.y}</span>
              </div>
            ))}
            {project.widgets.length === 0 && <div className="text-xs text-gray-600">No widgets yet</div>}
          </div>

          <div className="text-xs uppercase tracking-wider text-gray-500 mb-2 mt-4">Grid</div>
          <label className="flex items-center gap-2 text-xs text-gray-300 cursor-pointer mb-2">
            <input type="checkbox" checked={snapGrid} onChange={(e) => setSnapGrid(e.target.checked)} className="rounded border-[#2A2B33]" />
            Snap to grid
          </label>
          <div className="mb-2">
            <div className="text-[10px] uppercase tracking-wider text-gray-500 mb-1">Step (px)</div>
            <select
              className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs text-gray-300 disabled:opacity-40"
              value={snapSize}
              disabled={!snapGrid}
              onChange={(e) => setSnapSize(parseInt(e.target.value, 10))}>
              <option value={4}>4</option>
              <option value={8}>8</option>
              <option value={16}>16</option>
              <option value={32}>32</option>
            </select>
          </div>
          <p className="text-[10px] text-gray-600 leading-relaxed">Drag, arrow keys, and X/Y in properties respect snapping. Shift+arrow = 4× step (or 10px if snap off).</p>
        </div>

        {/* Center: canvas */}
        <div className="flex-1 min-w-0 overflow-auto checker flex items-center justify-center p-6">
          <div className="relative" style={{ width: 1024, height: 600 }}>
            {/* rim */}
            <div className="absolute -inset-3 rounded-2xl bg-gradient-to-b from-[#1A1B22] to-[#0B0C10] shadow-2xl" />
            <div
              ref={canvasRef}
              className="relative"
              style={{ width: 1024, height: 600, background: project.bg, borderRadius: 4, overflow: "hidden", boxShadow: "inset 0 0 0 1px #0003" }}
              onMouseDown={() => setSelectedId(null)}
            >
              {snapGrid && snapSize >= 2 && (
                <div
                  className="absolute inset-0 pointer-events-none z-[1]"
                  style={{
                    backgroundImage: `linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px)`,
                    backgroundSize: `${snapSize}px ${snapSize}px`,
                  }}
                />
              )}
              {demoMode ? (
                <div className="absolute inset-0 flex items-center justify-center text-gray-500 bg-black/50 backdrop-blur-sm z-50">
                  <div className="text-center">
                    <div className="text-2xl mb-2 text-[#00E5DD]">LVGL {demoMode} demo selected</div>
                    <div className="text-sm">Will run on device after flashing.</div>
                  </div>
                </div>
              ) : renderedWidgets.map(w => (
                <WidgetView
                  key={w.id}
                  w={w}
                  selected={w.id === selectedId}
                  onMouseDown={(e) => onWidgetMouseDown(w, e)}
                />
              ))}
            </div>
            <div className="absolute -bottom-6 left-0 text-xs text-gray-600">1024 × 600</div>
          </div>
        </div>

        {/* Right: properties */}
        <div className="w-72 shrink-0 border-l border-[#1E1F26] overflow-y-auto">
          {!selected ? (
            <div className="p-4">
              <div className="text-xs uppercase tracking-wider text-gray-500 mb-2">Canvas</div>
              <Field label="Background">
                <div className="flex items-center gap-2">
                  <input type="color" value={project.bg} onChange={(e) => applyProject(p => ({ ...p, bg: e.target.value }))} />
                  <input className="flex-1 bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs mono"
                    value={project.bg}
                    onChange={(e) => applyProject(p => ({ ...p, bg: e.target.value }))} />
                </div>
              </Field>
              <div className="mt-4 border-t border-[#1E1F26] pt-4">
                <div className="text-xs uppercase tracking-wider text-gray-500 mb-2">Build & Flash Bridge</div>
                <Field label="Bridge URL">
                  <TextInput value={bridgeUrl} onChange={setBridgeUrl} placeholder="http://127.0.0.1:8765" />
                </Field>
                <Field label="Serial Port">
                  <select className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs"
                    value={bridgePort} onChange={(e) => setBridgePort(e.target.value)}>
                    <option value="">Auto-detect</option>
                    {bridgePorts.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </Field>
                {bridgePorts.length > 1 && (
                  <p className="text-[10px] text-amber-400/90 mb-2 leading-relaxed">
                    Several USB serial devices detected — choose the port for your <b className="text-amber-300">ESP32-S3</b> (often the one you use for upload). Flash will not auto-pick when more than one device is connected.
                  </p>
                )}
                <label className="flex items-center gap-2 text-xs text-gray-400 cursor-pointer mb-2">
                  <input type="checkbox" checked={eraseFlash} onChange={(e) => setEraseFlash(e.target.checked)} className="rounded border-[#2A2B33]" />
                  Full chip erase before flash (first time after partition fix, or if upload keeps failing)
                </label>
                <p className="text-[10px] text-gray-600 mb-2 leading-relaxed">
                  Use the board&apos;s <b className="text-gray-400">UART / USB</b> port (data cable). The bridge uses USB-JTAG auto-reset — no BOOT button. If the port disappears during flash, wait for it to come back; discovery waits up to 45s.
                </p>
                <div className="text-[11px] text-gray-500 mb-2">{bridgeStatus}</div>
                {bridgeLog && (
                  <pre className="text-[10px] mono bg-[#0F1014] border border-[#2A2B33] rounded p-2 max-h-40 overflow-auto whitespace-pre-wrap text-gray-400">
                    {bridgeLog}
                  </pre>
                )}
              </div>
              <div className="mt-4 border-t border-[#1E1F26] pt-4">
                <div className="text-xs uppercase tracking-wider text-gray-500 mb-2">Hardware Config</div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Refresh (ms)">
                    <NumberInput value={hwConfig.refrPeriod} onChange={v => setHwConfig(c => ({...c, refrPeriod: v}))} min={1} max={100} />
                  </Field>
                  <Field label="Pixel Clk (MHz)">
                    <NumberInput value={hwConfig.pclkMHz} onChange={v => setHwConfig(c => ({...c, pclkMHz: v}))} min={10} max={40} />
                  </Field>
                  <Field label="Bounce Lines">
                    <NumberInput value={hwConfig.bounceLines} onChange={v => setHwConfig(c => ({...c, bounceLines: v}))} min={0} max={100} />
                  </Field>
                  <Field label="Tear Mode">
                    <select className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs mono"
                      value={hwConfig.tearingMode} onChange={e => setHwConfig(c => ({...c, tearingMode: parseInt(e.target.value)}))}>
                      <option value={0}>0: None</option>
                      <option value={1}>1: Full Refresh</option>
                      <option value={2}>2: Direct (2 FB)</option>
                      <option value={3}>3: Direct (Bounce)</option>
                    </select>
                  </Field>
                </div>
              </div>
              <div className="mt-6 text-xs text-gray-500 leading-relaxed">
                <p className="mb-2"><b className="text-gray-300">Tip:</b> Click a widget to edit, drag to move, arrow keys nudge.</p>
                <p className="mb-2"><b className="text-gray-300">Bind name:</b> widgets with a Bind get exposed as <code className="mono text-[#00E5DD]">ui_&lt;name&gt;</code> in generated C.</p>
                <p><b className="text-gray-300">Shortcuts:</b> ⌘/Ctrl+Z undo · Shift+⌘/Ctrl+Z redo · ⌘/Ctrl+S save · ⌘/Ctrl+E export · ⌘/Ctrl+D duplicate · Del remove · ↑↓←→ nudge</p>
              </div>
            </div>
          ) : (
            <Properties w={selected} onChange={updateSelected} onDelete={deleteSelected} onDuplicate={duplicateSelected} onMove={moveLayer} snapGrid={snapGrid} snapCoord={snapCoord} />
          )}
        </div>
      </div>

      {/* Export modal */}
      {showExport && (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={() => setShowExport(false)}>
          <div className="bg-[#0F1014] border border-[#2A2B33] rounded-lg w-[900px] max-w-[90vw] max-h-[85vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="p-4 border-b border-[#2A2B33] flex items-center">
              <div>
                <div className="font-semibold">Exported LVGL C</div>
                <div className="text-xs text-gray-500">Paste into your Arduino / ESP-IDF project; call <code className="mono text-[#00E5DD]">build_dashboard(lv_scr_act())</code>.</div>
              </div>
              <div className="flex-1" />
              <button onClick={() => { navigator.clipboard.writeText(exportText); }} className="px-3 py-1.5 rounded text-sm bg-[#00E5DD] text-black font-semibold mr-2">Copy</button>
              <button onClick={() => setShowExport(false)} className="px-3 py-1.5 rounded text-sm bg-[#17181C] border border-[#2A2B33]">Close</button>
            </div>
            <pre className="flex-1 overflow-auto p-4 text-xs mono text-gray-300 whitespace-pre">{exportText}</pre>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Small form pieces ----------
function Field({ label, children }) {
  return (
    <div className="mb-3">
      <div className="text-[10px] uppercase tracking-wider text-gray-500 mb-1">{label}</div>
      {children}
    </div>
  );
}
function NumberInput({ value, onChange, min, max, step = 1 }) {
  return (
    <input type="number" className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs mono num-input"
      value={value ?? 0} min={min} max={max} step={step}
      onChange={(e) => onChange(parseInt(e.target.value || "0"))} />
  );
}
function ColorInput({ value, onChange }) {
  return (
    <div className="flex items-center gap-2">
      <input type="color" value={value || "#000000"} onChange={(e) => onChange(e.target.value)} />
      <input className="flex-1 bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs mono uppercase"
        value={value || ""} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}
function TextInput({ value, onChange, placeholder }) {
  return (
    <input className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs"
      value={value ?? ""} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
  );
}

// ---------- Properties panel ----------
function Properties({ w, onChange, onDelete, onDuplicate, onMove, snapGrid, snapCoord }) {
  return (
    <div className="p-4">
      <div className="flex items-center gap-2 mb-3">
        <div className="w-6 h-6 rounded bg-[#17181C] border border-[#2A2B33] flex items-center justify-center text-sm">{WIDGET_DEFS[w.type]?.icon}</div>
        <div className="font-semibold text-sm capitalize">{w.type}</div>
        <div className="flex-1" />
        <button onClick={() => onMove("down")} title="Send backward" className="w-7 h-7 rounded bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] text-xs">↓</button>
        <button onClick={() => onMove("up")} title="Bring forward" className="w-7 h-7 rounded bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] text-xs">↑</button>
        <button onClick={onDuplicate} title="Duplicate" className="w-7 h-7 rounded bg-[#17181C] border border-[#2A2B33] hover:bg-[#1E1F26] text-xs">⎘</button>
        <button onClick={onDelete} title="Delete" className="w-7 h-7 rounded bg-red-500/10 border border-red-500/40 hover:bg-red-500/20 text-red-400 text-xs">✕</button>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <Field label="X"><NumberInput value={w.x} onChange={(v) => onChange({ x: snapGrid ? snapCoord(v) : v })} /></Field>
        <Field label="Y"><NumberInput value={w.y} onChange={(v) => onChange({ y: snapGrid ? snapCoord(v) : v })} /></Field>
        {w.type !== "label" && (
          <>
            <Field label="Width"><NumberInput value={w.w} onChange={(v) => onChange({ w: Math.max(1, snapGrid ? snapCoord(v) : v) })} min={1} /></Field>
            <Field label="Height"><NumberInput value={w.h} onChange={(v) => onChange({ h: Math.max(1, snapGrid ? snapCoord(v) : v) })} min={1} /></Field>
          </>
        )}
      </div>
      <Field label="Opacity %"><NumberInput value={w.opacity ?? 100} onChange={(v) => onChange({ opacity: clamp(v, 0, 100) })} min={0} max={100} /></Field>

      {(w.type === "label" || w.type === "button") && (
        <>
          <Field label="Text">
            <TextInput value={w.text} onChange={(v) => onChange({ text: v })} placeholder="Plain text or <<LV_SYMBOL_WIFI>> …" />
          </Field>
          <Field label="LVGL icons (tap to append)">
            <div className="text-[10px] text-gray-600 mb-1">Preview uses Font Awesome 4 (same glyphs as LVGL). Exported C uses <code className="mono text-gray-500">LV_SYMBOL_*</code> macros.</div>
            <div className="grid grid-cols-6 gap-1 max-h-40 overflow-y-auto p-1 rounded border border-[#2A2B33] bg-[#0F1014]">
              {LVGL_SYMBOL_LIST.map(([macro, title, cp]) => (
                <button
                  key={macro}
                  type="button"
                  title={`${macro} — ${title}`}
                  className="h-8 rounded bg-[#17181C] hover:bg-[#1E2A30] text-[#00E5DD] text-base leading-none border border-[#2A2B33] shrink-0"
                  style={{ fontFamily: "FontAwesome, sans-serif" }}
                  onClick={() => onChange({ text: `${w.text || ""}<<${macro}>>` })}>
                  {String.fromCodePoint(cp)}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Font size">
            <select className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs"
              value={w.fontSize} onChange={(e) => onChange({ fontSize: parseInt(e.target.value) })}>
              {FONT_SIZES.map(s => <option key={s} value={s}>{s}px</option>)}
            </select>
          </Field>
          <Field label="Text align">
            <select className="w-full bg-[#17181C] border border-[#2A2B33] rounded px-2 py-1 text-xs"
              value={w.textAlign || "left"} onChange={(e) => onChange({ textAlign: e.target.value })}>
              {TEXT_ALIGN_OPTIONS.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Font weight"><NumberInput value={w.fontWeight ?? (w.type === "button" ? 600 : 500)} onChange={(v) => onChange({ fontWeight: clamp(v, 100, 900) })} min={100} max={900} step={100} /></Field>
            {w.type === "label" && <Field label="Letter spacing"><NumberInput value={w.letterSpacing || 0} onChange={(v) => onChange({ letterSpacing: v })} min={-10} max={40} /></Field>}
          </div>
          <Field label={w.type === "button" ? "Text color" : "Color"}>
            <ColorInput value={w.type === "button" ? w.textColor : w.color}
              onChange={(v) => onChange(w.type === "button" ? { textColor: v } : { color: v })} />
          </Field>
        </>
      )}

      {(w.type === "rect" || w.type === "circle" || w.type === "button") && (
        <Field label="Background"><ColorInput value={w.color} onChange={(v) => onChange({ color: v })} /></Field>
      )}
      {(w.type === "rect" || w.type === "circle") && (
        <>
          <Field label="Border color"><ColorInput value={w.border} onChange={(v) => onChange({ border: v })} /></Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Border width"><NumberInput value={w.borderW} onChange={(v) => onChange({ borderW: v })} min={0} max={20} /></Field>
            {w.type === "rect" && <Field label="Radius"><NumberInput value={w.radius} onChange={(v) => onChange({ radius: v })} min={0} max={200} /></Field>}
          </div>
        </>
      )}
      {(w.type === "rect" || w.type === "circle" || w.type === "button") && (
        <>
          <Field label="Shadow color"><ColorInput value={w.shadowColor || "#000000"} onChange={(v) => onChange({ shadowColor: v })} /></Field>
          <div className="grid grid-cols-3 gap-2">
            <Field label="Blur"><NumberInput value={w.shadowBlur || 0} onChange={(v) => onChange({ shadowBlur: clamp(v, 0, 200) })} min={0} max={200} /></Field>
            <Field label="Offset X"><NumberInput value={w.shadowX || 0} onChange={(v) => onChange({ shadowX: v })} min={-200} max={200} /></Field>
            <Field label="Offset Y"><NumberInput value={w.shadowY || 0} onChange={(v) => onChange({ shadowY: v })} min={-200} max={200} /></Field>
          </div>
        </>
      )}

      {w.type === "bar" && (
        <>
          <Field label="Value (0-100)"><NumberInput value={w.value} onChange={(v) => onChange({ value: clamp(v, 0, 100) })} min={0} max={100} /></Field>
          <Field label="Background"><ColorInput value={w.bgColor} onChange={(v) => onChange({ bgColor: v })} /></Field>
          <Field label="Indicator"><ColorInput value={w.color} onChange={(v) => onChange({ color: v })} /></Field>
          <Field label="Radius"><NumberInput value={w.radius} onChange={(v) => onChange({ radius: v })} min={0} max={100} /></Field>
        </>
      )}

      {w.type === "arc" && (
        <>
          <Field label="Value (0-100)"><NumberInput value={w.value} onChange={(v) => onChange({ value: clamp(v, 0, 100) })} min={0} max={100} /></Field>
          <Field label="Background arc"><ColorInput value={w.bgColor} onChange={(v) => onChange({ bgColor: v })} /></Field>
          <Field label="Indicator"><ColorInput value={w.color} onChange={(v) => onChange({ color: v })} /></Field>
          <div className="grid grid-cols-3 gap-2">
            <Field label="Start°"><NumberInput value={w.start} onChange={(v) => onChange({ start: v })} min={0} max={360} /></Field>
            <Field label="Sweep°"><NumberInput value={w.sweep} onChange={(v) => onChange({ sweep: v })} min={1} max={360} /></Field>
            <Field label="Width"><NumberInput value={w.width} onChange={(v) => onChange({ width: v })} min={1} max={40} /></Field>
          </div>
        </>
      )}

      <Field label="Bind name (exposes as ui_<name> in C)">
        <TextInput value={w.bind} placeholder="e.g. speed, rpm, battery" onChange={(v) => onChange({ bind: v.replace(/[^a-zA-Z0-9_]/g, "") })} />
      </Field>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
